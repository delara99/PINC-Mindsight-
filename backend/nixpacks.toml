[phases.setup]
nixPkgs = ["nodejs", "npm", "chromium", "nss", "freetype", "freetype-dev", "libnss3", "libfreetype6", "libx11-6", "libxext6", "libxrender1", "libxtst6", "libxi6", "procps"]

[phases.install]
cmds = ["npm ci"]

[phases.build]
cmds = ["npm run build", "npx prisma generate"]

[start]
cmd = "npm run start:prod"

[envs]
PUPPETEER_SKIP_CHROMIUM_DOWNLOAD = "1"
PUPPETEER_EXECUTABLE_PATH = "/usr/bin/chromium"
